<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#00875A">
  <meta name="description" content="整理官方理賠文件，逐項準備並檢查，掌握送件前的下一步。">
  <link rel="icon" href="data:,">
  <title>理賠文件準備助手</title>
  <link rel="stylesheet" href="/src/styles/generated.css">
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
  <a href="#home-main-content" class="skip-link">跳至主要內容</a>
  <div id="viewTriage" class="landing">
    <header class="app-header home-header">
      <button type="button" class="brand-button" data-route="triage" aria-label="返回首頁">
        <img src="/assets/brand.png" alt="BNP PARIBAS CARDIF 法國巴黎人壽">
      </button>
      <nav class="home-nav" aria-label="主要導覽">
        <a href="https://life.cardif.com.tw/zh/a314" target="_blank" rel="noopener noreferrer">官方理賠資訊 ↗</a>
        <a href="#library">官方文件庫</a>
        <a href="#faq">常見問題</a>
        <button type="button" data-action="resume" class="text-link" id="homeResume" hidden>繼續準備</button>
      </nav>
    </header>
    <main id="home-main-content" tabindex="-1" class="landing-main">
      <div class="landing-intro">
        <h1>理賠申請，需要什麼？</h1>
        <p>從您的情況出發，整理應備文件。</p>
      </div>
      <div class="entry-grid">
        <section class="entry-card entry-guided" aria-labelledby="guided-entry-title">
          <svg class="entry-icon" width="64" height="64" viewBox="0 0 60 60" fill="none" aria-hidden="true">
            <path d="M30 48C40.4934 48 49 39.7173 49 29.5C49 19.2827 40.4934 11 30 11C19.5066 11 11 19.2827 11 29.5C11 33.7225 12.4418 37.6163 14.887 40.6725L12.5 48.5L20.8988 46.2872C23.6335 47.3828 26.7169 48 30 48Z" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 29.5h.01M30 29.5h.01M38 29.5h.01" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          </svg>
          <div class="entry-copy">
            <h2 id="guided-entry-title">還不確定怎麼準備</h2>
            <p>描述就醫情況，一起找到準備方向。</p>
          </div>
          <button type="button" data-route="assistant" class="btn primary entry-cta">
            描述我的狀況
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m13 5 7 7-7 7M20 12H4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </section>
        <section class="entry-card entry-direct" aria-labelledby="direct-entry-title">
          <svg class="entry-icon" width="64" height="64" viewBox="0 0 60 60" fill="none" aria-hidden="true">
            <path d="M16 11C13.7909 11 12 12.7909 12 15V45C12 47.2091 13.7909 49 16 49H28M16 11H34L44 21V28M34 11V21H44M19 21H27M19 27H35M19 33H29" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="38" cy="38" r="8" stroke="currentColor" stroke-width="2.4" fill="white"/><path d="m44 44 6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
          <div class="entry-copy">
            <h2 id="direct-entry-title">我知道理賠類型</h2>
            <p>直接選擇類型，查看應備清單。</p>
          </div>
          <button type="button" data-route="search" class="btn entry-cta">
            選擇理賠類型
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m13 5 7 7-7 7M20 12H4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </section>
      </div>
    </main>
    <footer class="app-footer home-footer">
      <div class="footer-caption"><span class="mode-indicator">模擬展示</span><span>請使用虛構資料。初步檢查不代表理賠核准。</span></div>
      <details class="service-info">
        <summary>服務說明</summary>
        <div class="service-popover"><span class="mode-label">Mock · 模擬對話與檢查</span><p>這是文件準備展示原型，不判定資格或給付，也不代送理賠。</p></div>
      </details>
    </footer>
  </div>
  <div id="app" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="dialog-root"></div>
  <div class="bg-watermark-birds" aria-hidden="true"></div>
  <div class="watermark-motif" aria-hidden="true"><svg width="180" height="180" viewBox="0 0 100 100" fill="currentColor"><path d="M15 75 C18 64,25 56,38 50 C31 58,27 68,24 78 Z M36 48 C42 36,55 28,72 21 C63 30,56 42,51 54 Z"/></svg></div>
  <div class="top-right-glow" aria-hidden="true"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
