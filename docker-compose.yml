services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SERVICE_MODE: ${VITE_SERVICE_MODE:-api}
    image: cardif-claim-preparation:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CASE_DB_PATH: /app/.local/cases.sqlite3
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000,http://127.0.0.1:5174,http://localhost:5174}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-grounded_rules}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - claim_data:/app/.local
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=67108864,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  claim_data:
  caddy_data:
  caddy_config:
